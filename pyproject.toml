[project]
name = "labboard"
version = "0.1.0"
description = "Read-only, federated artifact browser over a Tailscale tailnet"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
    "tomli-w>=1.0",
    "httpx>=0.27",
]

[project.scripts]
labboard = "labboard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
