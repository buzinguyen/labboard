<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}labboard{% endblock %} · {{ hostname }}</title>
<link rel="stylesheet" href="/static/pygments.css">
<style>
:root {
  --bg:#fbfbfa; --panel:#fff; --fg:#1a1a19; --muted:#6b6b68; --line:#e3e3e0;
  --accent:#2f6f4f; --accent-soft:#e8f2ec; --warn:#9a5b1e; --danger:#a33; --radius:10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#16171a; --panel:#1d1f23; --fg:#e6e6e3; --muted:#9a9a96; --line:#2c2f34;
    --accent:#7fc4a0; --accent-soft:#1e2b25; --warn:#d2954f; --danger:#e07070;
  }
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
}
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
code, pre, .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }

header {
  position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px;
  padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line);
}
header .brand { font-weight:650; letter-spacing:-.01em; }
header .host {
  font-size:12px; color:var(--muted); padding:2px 8px;
  border:1px solid var(--line); border-radius:99px;
}
header nav { margin-left:auto; display:flex; gap:14px; font-size:14px; }

main { max-width:1180px; margin:0 auto; padding:20px 18px 64px; }
h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em; }
h2 { font-size:16px; margin:26px 0 10px; }
.sub { color:var(--muted); font-size:13px; }

.crumbs { font-size:13px; margin-bottom:14px; color:var(--muted); word-break:break-all; }
.crumbs a { color:var(--muted); }
.crumbs a:hover { color:var(--accent); }
.crumbs .sep { opacity:.5; margin:0 5px; }
.crumbs .cur { color:var(--fg); }

.panel {
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:16px;
}
.stack { display:flex; flex-direction:column; gap:12px; }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.spacer { flex:1; }

/* pins */
.pin-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.pin {
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; display:flex; flex-direction:column; gap:6px;
}
.pin h3 { margin:0; font-size:15px; }
.pin .path { font-size:12px; color:var(--muted); word-break:break-all; }
.pin .tags { display:flex; gap:5px; flex-wrap:wrap; }
.tag {
  font-size:11px; background:var(--accent-soft); color:var(--accent);
  padding:1px 7px; border-radius:99px;
}
.gone { color:var(--danger); font-size:12px; }

/* listing */
table.listing { width:100%; border-collapse:collapse; font-size:14px; }
table.listing th {
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line);
}
table.listing td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
table.listing tr:hover td { background:var(--accent-soft); }
table.listing .num { text-align:right; color:var(--muted); font-size:13px; white-space:nowrap; }
.icon { width:20px; display:inline-block; text-align:center; opacity:.8; }
.thumb-cell { width:56px; }
.thumb-cell img {
  width:48px; height:32px; object-fit:cover; border-radius:4px;
  background:var(--accent-soft); display:block;
}

/* gallery */
.gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.card {
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column;
}
.card img { width:100%; aspect-ratio:16/10; object-fit:cover; background:var(--accent-soft); }
.card .cap { padding:7px 9px; font-size:12px; word-break:break-all; }
.card .cap .when { color:var(--muted); }
.badge-play {
  position:absolute; inset:auto 6px 6px auto; background:rgba(0,0,0,.6); color:#fff;
  font-size:10px; padding:1px 5px; border-radius:3px;
}
.card .wrap { position:relative; display:block; }

/* toolbar: filters, view switch */
.toolbar {
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;
  padding:9px 11px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius);
}
.toolbar input[type=search] { flex:1 1 220px; }
.toolbar select {
  background:var(--bg); color:var(--fg); border:1px solid var(--line);
  border-radius:7px; padding:7px 8px; font:inherit; font-size:13px;
}
.seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.seg a {
  padding:6px 11px; font-size:13px; color:var(--muted); border-right:1px solid var(--line);
}
.seg a:last-child { border-right:0; }
.seg a:hover { background:var(--bg); text-decoration:none; }
.seg a.on { background:var(--accent); color:var(--bg); font-weight:550; }

/* sortable columns */
th.sortable { cursor:pointer; user-select:none; }
th.sortable:hover { color:var(--fg); }
th.sortable::after { content:''; opacity:.45; margin-left:4px; }
th.sortable[data-dir=asc]::after  { content:'▲'; opacity:.85; }
th.sortable[data-dir=desc]::after { content:'▼'; opacity:.85; }

/* nested pin groups */
details.group { margin-bottom:10px; }
details.group > summary {
  display:flex; align-items:center; gap:9px; cursor:pointer; list-style:none;
  padding:7px 11px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); font-size:13px;
}
details.group > summary::-webkit-details-marker { display:none; }
details.group > summary::before { content:'▸'; color:var(--muted); font-size:11px; }
details.group[open] > summary::before { content:'▾'; }
details.group > summary:hover { border-color:var(--accent); }
.glabel { color:var(--muted); word-break:break-all; }
.gcount {
  margin-left:auto; font-size:11px; color:var(--accent); background:var(--accent-soft);
  padding:1px 8px; border-radius:99px; flex:none;
}
.gbody { padding:10px 0 4px 18px; border-left:1px solid var(--line); margin-left:13px; }
details.group.recent > summary { border-color:var(--accent); background:var(--accent-soft); }
details.group.recent > summary .glabel { color:var(--fg); }
button.danger, .btn.danger { color:var(--danger); border-color:var(--danger); }
.gbody > details.group:last-child { margin-bottom:0; }
a.tag:hover { text-decoration:none; filter:brightness(1.1); }

/* forms + buttons */
input[type=text], input[type=search] {
  background:var(--bg); color:var(--fg); border:1px solid var(--line);
  border-radius:7px; padding:7px 10px; font:inherit; font-size:14px; min-width:0;
}
input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
button, .btn {
  background:var(--accent); color:var(--bg); border:0; border-radius:7px;
  padding:7px 13px; font:inherit; font-size:14px; font-weight:550; cursor:pointer;
}
button.ghost, .btn.ghost {
  background:transparent; color:var(--muted); border:1px solid var(--line);
}
button:hover, .btn:hover { filter:brightness(1.07); text-decoration:none; }

/* two-column browse: listing left, nested-media panel right */
.split { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start; }
@media (min-width:960px) {
  .split:has(> .split-side:not([hidden])) { grid-template-columns:minmax(0,1fr) 300px; }
}
.split-main { min-width:0; }
.split-side {
  min-width:0; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:12px; position:sticky; top:60px;
  max-height:calc(100vh - 80px); overflow-y:auto;
}
.side-head { display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:13px; }
.side-head .gcount { margin-left:auto; }
.side-note { margin-bottom:9px; }
.side-list { display:flex; flex-direction:column; gap:3px; }
.side-item {
  display:flex; gap:9px; align-items:center; padding:5px; border-radius:7px; color:inherit;
}
.side-item:hover { background:var(--accent-soft); text-decoration:none; }
.side-item img {
  width:52px; height:34px; object-fit:cover; border-radius:4px;
  background:var(--accent-soft); flex:none;
}
.side-meta { display:flex; flex-direction:column; min-width:0; line-height:1.35; }
.side-name { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.side-dir, .side-when { font-size:11px; color:var(--muted); }
.side-dir { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }

/* viewers */
.viewer { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
.viewer video, .viewer img { max-width:100%; border-radius:6px; display:block; margin:0 auto; }
.viewer iframe { width:100%; height:82vh; border:0; border-radius:6px; }
.prose { max-width:none; }
.prose img, .prose video { max-width:100%; border-radius:6px; }
.prose pre { overflow-x:auto; padding:11px; border-radius:6px; background:var(--bg); font-size:13px; }
.prose code { background:var(--bg); padding:1px 4px; border-radius:3px; font-size:.9em; }
.prose pre code { background:none; padding:0; }
.prose table { border-collapse:collapse; display:block; overflow-x:auto; }
.prose th, .prose td { border:1px solid var(--line); padding:5px 9px; }
.prose blockquote { border-left:3px solid var(--line); margin-left:0; padding-left:14px; color:var(--muted); }
.hl { overflow-x:auto; border-radius:6px; font-size:13px; }
pre.plain { overflow-x:auto; font-size:13px; }
.scroll-x { overflow-x:auto; }
table.data { border-collapse:collapse; font-size:13px; white-space:nowrap; }
table.data th, table.data td { border:1px solid var(--line); padding:4px 9px; text-align:left; }
table.data th { background:var(--accent-soft); position:sticky; top:0; }

.note {
  background:var(--accent-soft); border-left:3px solid var(--accent);
  padding:9px 13px; border-radius:0 6px 6px 0; font-size:13px;
}
.note.warn { border-color:var(--warn); }
.empty { color:var(--muted); text-align:center; padding:44px 16px; }

/* ---- projects dashboard ---- */
.totals { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.stat {
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:9px 14px; min-width:92px;
}
.stat .n { font-size:21px; font-weight:650; line-height:1.15; letter-spacing:-.02em; }
.stat .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.stat.alert .n { color:var(--warn); }
.stat.bad .n { color:var(--danger); }

/* A grid, not a column: with a dozen projects the point is to see them all at once. */
.proj-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:13px; align-items:start;
}
.proj {
  background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--line);
  border-radius:var(--radius); padding:13px 15px 12px;
  display:flex; flex-direction:column; gap:8px; min-width:0;
}
.proj.pending { border-top-color:var(--accent); }
.proj.blocked, .proj.warn { border-top-color:var(--danger); }
.proj.stale  { border-top-color:var(--warn); }
.proj.active { border-top-color:var(--accent); }

.proj-head { display:flex; align-items:baseline; gap:8px; color:inherit; }
.proj-head h2 { margin:0; font-size:16px; letter-spacing:-.01em; min-width:0; word-break:break-word; }
.proj-head .go { margin-left:auto; color:var(--muted); flex:none; }
.proj-head:hover { text-decoration:none; }
.proj-head:hover h2 { color:var(--accent); }
.proj-head:hover .go { color:var(--accent); }

.proj-where { font-size:12px; color:var(--muted); margin-top:-4px; }
.proj-where b { color:var(--fg); font-weight:600; }
.bad-text { color:var(--danger); font-style:normal; }

.flags { display:flex; flex-direction:column; gap:4px; }
.flag {
  font-size:11.5px; color:var(--danger); background:transparent;
  border:1px solid var(--danger); border-radius:6px; padding:3px 7px; line-height:1.35;
}

/* the current-ticket preview — the card's main content, and a link into detail */
.proj .current {
  display:block; padding:9px 11px; background:var(--bg); border-radius:8px; color:inherit;
}
.proj .current:hover { text-decoration:none; background:var(--accent-soft); }
.cline { display:flex; align-items:center; gap:7px; margin-bottom:3px; }
.cline .sub { margin-left:auto; font-size:11.5px; }
.proj .ttitle {
  font-size:14px; font-weight:550; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.tprev {
  font-size:12px; color:var(--muted); line-height:1.45; margin-top:4px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.cmeta { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
.proj .current.none { color:var(--muted); font-size:13px; }

.waiting {
  font-size:12.5px; color:var(--accent); background:var(--accent-soft);
  padding:6px 10px; border-radius:7px; display:block;
}
.waiting:hover { text-decoration:none; filter:brightness(1.05); }

.counts { display:flex; gap:9px; flex-wrap:wrap; font-size:12px; }
.counts a { color:var(--muted); }
.counts a:hover { color:var(--accent); }

/* ticket cards on the project page */
.ticket {
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px 15px; margin-bottom:10px; scroll-margin-top:70px;
}
.ticket.is-current { border-color:var(--accent); }
.ticket:target { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.ticket .thead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ticket h3 { margin:5px 0 0; font-size:15px; font-weight:550; line-height:1.4; }
.tmeta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:7px; }
.ticket details { margin-top:9px; }
.ticket summary { cursor:pointer; font-size:12px; }
.receipt-card { border-style:dashed; }
.receipt-card.acked { opacity:.6; }

.pill {
  font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line);
  color:var(--muted); white-space:nowrap;
}
.pill.on   { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.pill.warn { background:transparent; color:var(--warn); border-color:var(--warn); }
.pill.bad  { background:transparent; color:var(--danger); border-color:var(--danger); }

.tid { font-size:12px; color:var(--muted); }

.ticket-body { font-size:13px; margin-top:9px; padding-top:9px; border-top:1px solid var(--line); }
.ticket-body h1, .ticket-body h2, .ticket-body h3 { font-size:13px; margin:9px 0 3px; }
.ticket-body > *:first-child { margin-top:0; }
.ticket-body p, .ticket-body ul, .ticket-body ol { margin:3px 0; }

/* private notes — localStorage only, never sent anywhere */
.notebox { margin-top:2px; }
.notebox .nhead {
  display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted);
  text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px;
}
.notebox .nhead .saved { color:var(--accent); text-transform:none; letter-spacing:0; font-size:11px; }
.notebox textarea {
  width:100%; resize:vertical; background:var(--bg); color:var(--fg);
  border:1px solid var(--line); border-radius:7px; padding:8px 10px;
  font:inherit; font-size:13px; line-height:1.5; display:block;
}
.notebox textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
.notebox .nfoot { display:flex; align-items:center; gap:8px; margin-top:5px; }
.notebox button { font-size:12px; padding:4px 10px; }
.stale-note { color:var(--warn); font-size:11.5px; }

/* board */
table.tickets { width:100%; border-collapse:collapse; font-size:14px; }
table.tickets th {
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line);
}
table.tickets td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
table.tickets tr:hover td { background:var(--accent-soft); }
table.tickets .tid { white-space:nowrap; color:var(--muted); font-size:13px; }
.st { font-size:11px; padding:1px 8px; border-radius:99px; white-space:nowrap; }
.st.active  { background:var(--accent-soft); color:var(--accent); }
.st.blocked { background:transparent; color:var(--danger); border:1px solid var(--danger); }
.st.open    { background:transparent; color:var(--muted); border:1px solid var(--line); }
.st.done    { background:transparent; color:var(--muted); }
.st.dropped { background:transparent; color:var(--muted); text-decoration:line-through; }

/* portal */
.node { margin-bottom:18px; }
.node .head { display:flex; align-items:center; gap:9px; margin-bottom:8px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
.dot.up { background:var(--accent); }
.dot.down { background:var(--danger); }
.node .why { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <span class="brand"><a href="/" style="color:inherit">labboard</a></span>
  <span class="host mono">{{ hostname }}</span>
  <nav>
    <a href="/projects">Projects</a>
    <a href="/board">Board</a>
    <a href="/">Pins</a>
    <a href="/portal">Tailnet</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
